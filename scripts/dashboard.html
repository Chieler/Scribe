<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribe</title>
<style>
  :root{
    --bg:#f7f7f8; --panel:#fff; --line:#e5e5ea; --ink:#16161a; --muted:#71717a;
    --accent:#3457e8; --accent-soft:#eaeefd; --green:#1a8f5a; --green-soft:#e8f6ef;
    --amber:#8a6100; --amber-soft:#fdf3e0; --red:#b42318; --red-soft:#fdecea;
    /* Four steps, ~1.25 apart. Everything supporting is one size, everything
       readable is one size; the jumps carry the hierarchy instead of ten
       sizes sitting within three pixels of each other. */
    --fs-micro:11px; --fs-base:13.5px; --fs-lead:17px; --fs-title:21px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-size:var(--fs-base); line-height:1.45;
  }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }

  header{
    background:var(--panel); border-bottom:1px solid var(--line); padding:14px 24px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  header .wm{ font-weight:700; font-size:var(--fs-lead); }
  header .path{ font-size:var(--fs-base); color:var(--muted); }
  header .spacer{ flex:1; }

  button{ font:inherit; cursor:pointer; }
  .btn{
    font-size:var(--fs-base); font-weight:600; padding:8px 14px; border-radius:7px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
  }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* --- the two choices that change the output --- */
  .controls{
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:12px 24px; display:flex; align-items:center; gap:26px; flex-wrap:wrap;
  }
  .ctl{ display:flex; align-items:center; gap:10px; }
  .ctl > label{ font-size:var(--fs-micro); font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .seg{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button{
    border:0; background:var(--panel); padding:7px 13px; font-size:var(--fs-base); color:var(--muted);
    border-right:1px solid var(--line);
  }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-pressed="true"]{ background:var(--accent-soft); color:var(--accent); font-weight:700; }
  .seg .sub{ display:block; font-size:var(--fs-micro); font-weight:400; color:var(--muted); }
  .seg button[aria-pressed="true"] .sub{ color:var(--accent); }

  .scores{ margin-left:auto; display:flex; gap:22px; }
  .score{ text-align:right; }
  .score b{ display:block; font-size:var(--fs-lead); font-variant-numeric:tabular-nums; }
  .score span{ font-size:var(--fs-micro); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .score.lead b{ color:var(--accent); }

  .rig{ max-width:1280px; margin:0 auto; display:grid; grid-template-columns:340px 1fr; gap:16px; padding:20px; }
  @media (max-width:900px){ .rig{ grid-template-columns:1fr; } }

  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .panel-head h2{ margin:0; font-size:var(--fs-micro); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .panel-head .n{ font-size:var(--fs-micro); color:var(--muted); }

  .row{
    width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line);
    padding:11px 8px; border-radius:6px; display:block;
  }
  .row:last-of-type{ border-bottom:none; }
  .row[aria-selected="true"]{ background:var(--accent-soft); }
  .row .top{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .row .fname{ font-size:var(--fs-base); font-weight:600; word-break:break-all; }
  .row .fmeta{ font-size:var(--fs-micro); color:var(--muted); margin-top:2px; }
  .row .fmeta.none{ color:var(--amber); }

  .chip{ font-size:var(--fs-micro); font-weight:600; padding:2px 8px; border-radius:20px; flex:none; }
  .chip.ready{ background:#f0f0f2; color:var(--muted); }
  .chip.working{ background:var(--accent-soft); color:var(--accent); }
  .chip.done{ background:var(--green-soft); color:var(--green); }
  .x{ cursor:pointer; color:var(--muted); padding:0 4px; border-radius:4px; flex:none;
      line-height:1; }
  .x:hover{ background:var(--red-soft); color:var(--red); }
  .waiting{ padding:10px 14px; color:var(--muted); font-size:var(--fs-micro);
            border-top:1px solid var(--line); }
  .waiting div{ margin-top:6px; }
  .chip.failed{ background:var(--red-soft); color:var(--red); }

  /* Both bars animate transform only. The indeterminate one runs for the whole
     length of a job, so animating margin-left here would relayout every frame
     of every transcription. */
  .bar{ height:5px; background:#eee; border-radius:3px; overflow:hidden; margin-top:7px; }
  .bar i{ display:block; height:100%; width:100%; background:var(--accent);
          transform-origin:left; transform:scaleX(0); transition:transform .25s; }
  .bar.indet i{ width:35%; transform:none; transition:none;
                animation:slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide{ from{ transform:translateX(0) } to{ transform:translateX(186%) } }
  @media (prefers-reduced-motion:reduce){
    .bar i{ transition:none; }
    .bar.indet i{ animation:none; width:100%; opacity:.35; }
  }

  .dropzones{ display:flex; gap:10px; margin-top:12px; }
  .dropzone{
    flex:1; border:1.5px dashed var(--line); border-radius:8px; padding:16px 10px;
    text-align:center; color:var(--muted); font-size:var(--fs-base); cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
  }
  .dropzone.audio{ border-color:#b9c4f5; background:#fafbff; }
  .dropzone.doc{ border-color:#a9d9c3; background:#f8fdfb; }
  .dropzone .dz-label{ font-weight:700; color:var(--ink); }
  .dropzone.audio .dz-label{ color:var(--accent); }
  .dropzone.doc .dz-label{ color:var(--green); }
  .dropzone .dz-hint{ font-size:var(--fs-micro); }
  .dropzone.over{ border-style:solid; }
  .dropzone.audio.over{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
  .dropzone.doc.over{ border-color:var(--green); background:var(--green-soft); color:var(--green); }

  .now .vname{ font-size:var(--fs-title); font-weight:700; word-break:break-all; }
  .now .vmeta{ font-size:var(--fs-base); color:var(--muted); margin-bottom:16px; }

  .stage{ display:flex; justify-content:space-between; font-size:var(--fs-base); margin-bottom:6px; }
  .stage b{ color:var(--accent); font-variant-numeric:tabular-nums; }
  .bar.big{ height:8px; border-radius:5px; margin-bottom:20px; }

  .terms{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:18px; }
  .term{ font-size:var(--fs-micro); background:#f2f2f4; border-radius:5px; padding:2px 7px; }

  .transcript{ border:1px solid var(--line); border-radius:8px; overflow:hidden; max-height:420px; overflow-y:auto; }
  /* 72px so an 8-character timecode in mono never overruns its own column,
     then a gap so the caption does not start against it. */
  .t-row{ display:grid; grid-template-columns:72px 1fr; gap:14px; padding:11px 14px;
          border-bottom:1px solid var(--line); font-size:var(--fs-base); }
  .t-row:last-child{ border-bottom:none; }
  .t-row .tc{ color:var(--muted); }
  .strike{ text-decoration:line-through; color:#b3b3ba; margin-right:4px; }
  .fix{ color:var(--green); font-weight:600; }
  .src{ display:block; font-size:var(--fs-micro); color:var(--accent); margin-top:3px; }

  .export{ display:flex; gap:10px; margin-top:18px; }
  .export .btn{ flex:1; text-align:center; text-decoration:none; }
  .empty{ color:var(--muted); font-size:var(--fs-base); padding:26px 0; text-align:center; }
  .err{ background:var(--red-soft); color:var(--red); border-radius:8px; padding:12px 14px;
        font-size:var(--fs-base); white-space:pre-wrap; margin-bottom:16px; }
  .note{ font-size:var(--fs-micro); color:var(--muted); margin-top:14px; }
</style>
</head>
<body>

<header>
  <span class="wm">Scribe</span>
  <span class="path mono" id="dropPath">dropoff/</span>
  <div class="spacer"></div>
  <button class="btn primary" id="run">Caption</button>
</header>

<div class="controls">
  <div class="ctl">
    <label id="lblModel">Model</label>
    <div class="seg" role="group" aria-labelledby="lblModel" id="segModel">
      <button data-preset="110m" aria-pressed="true">Small<span class="sub">438 MB · 59x</span></button>
      <button data-preset="1.1b" aria-pressed="false">Large<span class="sub">4.0 GB · 30x</span></button>
    </div>
  </div>

  <div class="ctl">
    <label id="lblCombo">Second opinion</label>
    <div class="seg" role="group" aria-labelledby="lblCombo" id="segCombo">
      <button data-second="0" aria-pressed="true">Off<span class="sub">one model</span></button>
      <button data-second="1" aria-pressed="false">On<span class="sub">+1.6 GB Whisper</span></button>
    </div>
  </div>

  <div class="scores">
    <div class="score lead"><b id="sRecall">0.9073</b><span>term recall</span></div>
    <div class="score"><b id="sWer">0.0850</b><span>WER</span></div>
    <div class="score"><b id="sSpeed">59x</b><span>realtime</span></div>
  </div>
</div>

<div class="rig">
  <section class="panel">
    <div class="panel-head"><h2>Drop-off</h2><span class="n" id="fileCount">0 recordings</span></div>
    <div id="files"></div>
    <div class="dropzones">
      <div class="dropzone audio" id="dropAudio">
        <span class="dz-label">Recording</span>
        <span class="dz-hint">m4a, wav, mp3…</span>
      </div>
      <div class="dropzone doc" id="dropDoc">
        <span class="dz-label">Document</span>
        <span class="dz-hint">pdf, txt, docx… — same basename as the recording</span>
      </div>
    </div>
    <input type="file" id="picker" multiple hidden>
    <p class="note">A recording with no matching document is still transcribed, unbiased. That is the honest baseline.</p>
  </section>

  <section class="panel" id="detail"></section>
</div>

<script>
const $ = (id) => document.getElementById(id);
let selected = null, lastSig = "";

/* ---- controls ---------------------------------------------------------- */
function segment(el, attr, onPick) {
  el.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...el.children].forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    onPick(btn.dataset[attr]);
  });
}
const settings = { preset: "110m", second_opinion: false };
function pushSettings() {
  fetch("/api/settings", { method: "POST", body: JSON.stringify(settings) }).then(refresh);
}
segment($("segModel"), "preset", (v) => { settings.preset = v; pushSettings(); });
segment($("segCombo"), "second", (v) => { settings.second_opinion = v === "1"; pushSettings(); });

/* ---- upload ------------------------------------------------------------ */
async function upload(files) {
  const rejected = [];
  for (const f of files) {
    const r = await fetch("/api/upload?name=" + encodeURIComponent(f.name), {
      method: "PUT", body: f,
    }).then((x) => x.json());
    if (r.error) rejected.push(r.error);
  }
  if (rejected.length) alert(rejected.join("\n"));
  refresh();
}
/* Two zones, same upload — pairing is by filename on the backend regardless
   of which zone a file lands in, so both just persist whatever is dropped. */
$("picker").addEventListener("change", (e) => upload(e.target.files));
for (const drop of [$("dropAudio"), $("dropDoc")]) {
  drop.addEventListener("click", () => $("picker").click());
  ["dragenter", "dragover"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) =>
    drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => upload(e.dataTransfer.files));
}

/* Delegated so it covers rows and waiting documents alike, and survives the
   re-render that the 700ms poll does underneath it. */
document.addEventListener("click", async (e) => {
  const x = e.target.closest("[data-del]");
  if (!x) return;
  e.stopPropagation();
  const name = x.dataset.del;
  if (!confirm(`Remove ${name} from the drop-off? Any captions written for it go too.`)) return;
  const res = await fetch("/api/file?name=" + encodeURIComponent(name), { method: "DELETE" });
  const r = await res.json();
  // 404 means it went with a sibling we just removed -- the refresh below is
  // the whole correction needed.
  if (r.error && res.status !== 404) alert(r.error);
  if (name === selected) selected = null;
  refresh();
});

$("run").addEventListener("click", async () => {
  const r = await fetch("/api/run", { method: "POST", body: "{}" }).then((x) => x.json());
  if (r.error) alert(r.error);
  refresh();
});

/* ---- render ------------------------------------------------------------ */
const mb = (n) => (n / 1048576).toFixed(1) + " MB";
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

/* A determinate bar scales; an indeterminate one slides. Never sets an inline
   transform on the sliding variant, which would fight its keyframes. */
function bar(f, big) {
  const indet = f.stage !== "transcribing";
  const fill = indet ? "" : ` style="transform:scaleX(${(f.progress || 0) / 100})"`;
  return `<div class="bar${big ? " big" : ""}${indet ? " indet" : ""}"><i${fill}></i></div>`;
}

function renderFiles(st) {
  $("fileCount").textContent = st.files.length + (st.files.length === 1 ? " recording" : " recordings");
  $("files").innerHTML = st.files.length ? "" : '<div class="empty">Nothing dropped off yet.</div>';
  for (const f of st.files) {
    const b = document.createElement("button");
    b.className = "row";
    b.setAttribute("aria-selected", String(f.name === selected));
    b.innerHTML =
      `<div class="top"><span class="fname">${esc(f.name)}</span>` +
      `<span class="chip ${f.status}">${f.status === "working" ? esc(f.stage || "working") : f.status}</span>` +
      `<span class="x" data-del="${esc(f.name)}" title="Remove ${esc(f.name)}">&times;</span></div>` +
      `<div class="fmeta${f.docs.length + f.shared.length ? "" : " none"}">${mb(f.size)} · ` +
      `${f.docs.length + f.shared.length
          ? "biased by " + f.docs.concat(f.shared).map(esc).join(", ")
          : "no document — unbiased"}</div>` +
      (f.status === "working" ? bar(f) : "");
    b.onclick = () => { selected = f.name; render(st); };
    $("files").appendChild(b);
  }
  const waiting = st.unpaired || [];
  if (waiting.length) {
    const d = document.createElement("div");
    d.className = "waiting";
    d.innerHTML =
      waiting.map((n) =>
        `<span class="term">${esc(n)}<span class="x" data-del="${esc(n)}" ` +
        `title="Remove ${esc(n)}">&times;</span></span>`).join("") +
      `<div>Attached to no recording. Drop one in with the same name, or remove ` +
      `${waiting.length === 1 ? "it" : "them"}.</div>`;
    $("files").appendChild(d);
  }
}

/* Mark the first span in this cue that the second model rewrote, showing what
   it replaced. Index-based rather than regex so caption text containing
   regex metacharacters cannot break the render. */
function renderCue(cue, changes) {
  const lower = cue.text.toLowerCase();
  for (const ch of changes) {
    if (!ch.to || !ch.from) continue;
    const at = lower.indexOf(ch.to.toLowerCase());
    if (at === -1) continue;
    const body =
      esc(cue.text.slice(0, at)) +
      `<span class="strike">${esc(ch.from)}</span>` +
      `<span class="fix">${esc(cue.text.substr(at, ch.to.length))}</span>` +
      esc(cue.text.slice(at + ch.to.length)) +
      `<span class="src">Corrected by the second model</span>`;
    return `<div class="t-row"><span class="tc mono">${esc(cue.time)}</span><span>${body}</span></div>`;
  }
  return `<div class="t-row"><span class="tc mono">${esc(cue.time)}</span><span>${esc(cue.text)}</span></div>`;
}

/* Named documents bias this recording alone; shared ones bias every recording
   in the drop-off. Saying which is which is the difference between a rule and
   magic. */
function sources(f) {
  const all = f.docs.concat(f.shared);
  if (!all.length) return "unbiased";
  const shared = f.shared.length ? ` (${f.shared.map(esc).join(", ")} shared)` : "";
  return f.docs.concat(f.shared).map(esc).join(", ") + shared +
    " \u2192 " + (f.terms.length ? f.terms.length + "+ terms" : "terms");
}

function renderDetail(st) {
  const f = st.files.find((x) => x.name === selected) || st.files.find((x) => x.status === "working") || st.files[0];
  const d = $("detail");
  if (!f) { d.innerHTML = '<div class="empty">Drop a recording in to get started.</div>'; return; }
  selected = f.name;

  const changes = f.changes || [], cues = f.cues || [];

  d.innerHTML =
    (st.error ? `<div class="err">${esc(st.error)}</div>` : "") +
    `<div class="now"><div class="vname">${esc(f.name)}</div>` +
    `<div class="vmeta">${mb(f.size)} · ${sources(f)}` +
    `${f.status === "done" && changes.length ? " · " + changes.length + " span" + (changes.length === 1 ? "" : "s") + " corrected by the second model" : ""}</div></div>` +

    (f.status === "working"
      ? `<div class="stage"><span>${esc(f.stage || "working")}</span>` +
        `<b>${f.stage === "transcribing" ? f.progress + "%" : ""}</b></div>` +
        bar(f, true)
      : "") +

    (f.terms.length ? `<div class="terms">${f.terms.map((t) => `<span class="term">${esc(t)}</span>`).join("")}</div>` : "") +

    (cues.length
      ? `<div class="transcript">${cues.map((c) => renderCue(c, changes)).join("")}</div>`
      : f.status === "done" ? ""
      : f.status === "working"
        ? `<div class="empty">${st.second_opinion
            ? "Holding the transcript back until the second model has read the audio."
            : "Transcribing\u2026"}</div>`
        : `<div class="empty">No captions yet. Press \u201CCaption\u201D.</div>`) +

    (f.status === "done"
      ? `<div class="export"><a class="btn primary" href="/api/txt?name=${encodeURIComponent(f.name)}" download>Download .TXT</a><a class="btn" href="/api/srt?name=${encodeURIComponent(f.name)}" download>Download .SRT</a></div>`
      : "");
}

function render(st) {
  $("sRecall").textContent = st.scores.recall;
  $("sWer").textContent = st.scores.wer;
  $("sSpeed").textContent = st.scores.speed;
  $("run").disabled = st.running || !st.files.length;
  $("run").textContent = st.running ? "Working…" : "Caption";
  renderFiles(st);
  renderDetail(st);
}

async function refresh() {
  const st = await fetch("/api/state").then((r) => r.json());
  const sig = JSON.stringify(st) + selected;
  if (sig !== lastSig) { lastSig = sig; render(st); }
}
refresh();
setInterval(refresh, 700);
</script>
</body>
</html>
