<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scribe Benchmark</title>
<style>
  :root{--bg:#f7f7f8;--panel:#fff;--line:#e5e5ea;--ink:#16161a;--muted:#71717a;--accent:#3457e8;--soft:#eaeefd;--green:#1a8f5a;--green-soft:#e8f6ef;--red:#b42318;--red-soft:#fdecea}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header,.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px}.wm{font-size:17px;font-weight:700}.path,.note,.meta{color:var(--muted)}.spacer{flex:1}
  button,.btn{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-weight:600;padding:8px 14px;text-decoration:none}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
  .controls{padding:12px 24px;gap:26px}.ctl{display:flex;align-items:center;gap:10px}.ctl>label,.label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 13px}.seg button:last-child{border:0}.seg button[aria-pressed="true"]{background:var(--soft);color:var(--accent);font-weight:700}.sub{display:block;font-size:11px;font-weight:400}.scores{margin-left:auto;display:flex;gap:20px}.score{text-align:right}.score b{display:block;font-size:17px}.score span{color:var(--muted);font-size:11px;text-transform:uppercase}
  .rig{display:grid;grid-template-columns:340px 1fr;gap:16px;max-width:1280px;margin:auto;padding:20px}@media(max-width:900px){.rig{grid-template-columns:1fr}}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.panel-head h2{font-size:11px;letter-spacing:.04em;margin:0;text-transform:uppercase}.row{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 8px;text-align:left}.row[aria-selected="true"]{background:var(--soft)}.top{display:flex;gap:8px;justify-content:space-between}.fname{font-weight:600;word-break:break-all}.chip{border-radius:20px;font-size:11px;font-weight:600;padding:2px 8px}.chip.ready{background:#f0f0f2;color:var(--muted)}.chip.working{background:var(--soft);color:var(--accent)}.chip.done{background:var(--green-soft);color:var(--green)}.chip.failed,.chip.needs{background:var(--red-soft);color:var(--red)}
  .dropzones{display:flex;gap:10px;margin-top:12px}.dropzone{flex:1;display:flex;flex-direction:column;gap:3px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);cursor:pointer;padding:16px 10px;text-align:center}.dropzone .dz-label{font-weight:700;color:var(--ink)}.dropzone .dz-hint{font-size:11px}.dropzone.audio{border-color:#b9c4f5;background:#fafbff}.dropzone.audio .dz-label{color:var(--accent)}.dropzone.doc{border-color:#a9d9c3;background:#f8fdfb}.dropzone.doc .dz-label{color:var(--green)}.dropzone.over{border-style:solid}.dropzone.audio.over{border-color:var(--accent);background:var(--soft);color:var(--accent)}.dropzone.doc.over{border-color:var(--green);background:var(--green-soft);color:var(--green)}.empty{color:var(--muted);padding:26px 0;text-align:center}.err{background:var(--red-soft);color:var(--red);border-radius:8px;margin-bottom:16px;padding:12px;white-space:pre-wrap}.now{margin-bottom:18px}.now .vname{font-size:21px;font-weight:700}.metrics{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.metric{border:1px solid var(--line);border-radius:8px;min-width:105px;padding:10px}.metric b{display:block;font-size:17px}.metric span{color:var(--muted);font-size:11px;text-transform:uppercase}.text{border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;padding:12px;white-space:pre-wrap}.label{display:block;margin:16px 0 6px}.export{display:flex;gap:10px;margin-top:18px}.bar{height:6px;background:#eee;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .25s}
</style>
</head>
<body>
<header><span class="wm">Scribe Benchmark</span><span class="path mono">benchmark/</span><div class="spacer"></div><a class="btn" href="/">User workspace</a><button class="btn primary" id="run">Run benchmark</button></header>
<div class="controls">
  <div class="ctl"><label>Model</label><div class="seg" id="models"><button data-preset="110m" aria-pressed="true">Small<span class="sub">438 MB · 59x</span></button><button data-preset="1.1b" aria-pressed="false">Large<span class="sub">4.0 GB · 30x</span></button></div></div>
  <div class="ctl"><label>Second opinion</label><div class="seg" id="second"><button data-second="0" aria-pressed="true">Off<span class="sub">one model</span></button><button data-second="1" aria-pressed="false">On<span class="sub">Whisper fusion</span></button></div></div>
  <div class="scores"><div class="score"><b id="speed">59x</b><span>realtime</span></div><div class="score"><b>WER</b><span>reference score</span></div></div>
</div>
<main class="rig"><section class="panel"><div class="panel-head"><h2>Benchmark drop-off</h2><span class="meta" id="count">0 recordings</span></div><div id="files"></div><div class="dropzones"><div class="dropzone audio" id="dropAudio"><span class="dz-label">Recording</span></div><div class="dropzone doc" id="dropRef"><span class="dz-label">Reference</span><span class="dz-hint"><span class="mono">recording.reference.txt</span></span></div></div><input id="picker" type="file" multiple hidden><p class="note">Source text only scores output. It never biases transcription.</p></section><section class="panel" id="detail"></section></main>
<script>
const $=id=>document.getElementById(id);let selected=null,last="";const settings={preset:"110m",second_opinion:false};
function segment(id,attr,fn){$(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$(id).children].forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset[attr])}}
function push(){fetch("/api/benchmark/settings",{method:"POST",body:JSON.stringify(settings)}).then(refresh)}
segment("models","preset",v=>{settings.preset=v;push()});segment("second","second",v=>{settings.second_opinion=v==="1";push()});
async function upload(files){const bad=[];for(const f of files){const r=await fetch("/api/benchmark/upload?name="+encodeURIComponent(f.name),{method:"PUT",body:f}).then(x=>x.json());if(r.error)bad.push(r.error)}if(bad.length)alert(bad.join("\n"));refresh()}
$("picker").onchange=e=>upload(e.target.files);for(const drop of [$("dropAudio"),$("dropRef")]){drop.onclick=()=>$("picker").click();["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));drop.addEventListener("drop",e=>upload(e.dataTransfer.files));}
$("run").onclick=async()=>{const r=await fetch("/api/benchmark/run",{method:"POST",body:"{}"}).then(x=>x.json());if(r.error)alert(r.error);refresh()};
const esc=s=>String(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));const mb=n=>(n/1048576).toFixed(1)+" MB";
function render(st){$("speed").textContent=st.scores.speed;$("count").textContent=st.files.length+" recording"+(st.files.length===1?"":"s");$("run").disabled=st.running||!st.files.some(f=>f.reference);$("run").textContent=st.running?"Working…":"Run benchmark";const box=$("files");box.innerHTML=st.files.length?"":"<div class=empty>Nothing dropped off yet.</div>";for(const f of st.files){const b=document.createElement("button");b.className="row";b.setAttribute("aria-selected",f.name===selected);const label=f.status==="needs reference"?"needs reference":f.status;b.innerHTML=`<div class=top><span class=fname>${esc(f.name)}</span><span class="chip ${f.status.replace(" ","")}">${label}</span></div><div class=meta>${mb(f.size)} · ${f.reference?esc(f.reference):"add source of truth"}${f.score?" · WER "+(f.score.wer*100).toFixed(1)+"%":""}</div>`;b.onclick=()=>{selected=f.name;render(st)};box.appendChild(b)}const f=st.files.find(x=>x.name===selected)||st.files.find(x=>x.status==="working")||st.files[0],d=$("detail");if(!f){d.innerHTML="<div class=empty>Drop matching audio and source text to begin.</div>";return}selected=f.name;const s=f.score;d.innerHTML=(st.error?`<div class=err>${esc(st.error)}</div>`:"")+`<div class=now><div class=vname>${esc(f.name)}</div><div class=meta>${f.reference?"Source of truth "+esc(f.reference):"Missing <span class=mono>"+esc(f.name.replace(/\.[^.]+$/,""))+".reference.txt</span>"}</div></div>`+(f.status==="working"?`<div class=meta>${esc(f.stage||"working")} ${f.progress||0}%</div><div class=bar><i style="transform:scaleX(${(f.progress||0)/100})"></i></div>`:"")+(s?`<div class=metrics><div class=metric><b>${(s.wer*100).toFixed(1)}%</b><span>WER</span></div><div class=metric><b>${s.substitutions}</b><span>substitutions</span></div><div class=metric><b>${s.deletions}</b><span>deletions</span></div><div class=metric><b>${s.insertions}</b><span>insertions</span></div><div class=metric><b>${s.reference_words}</b><span>reference words</span></div></div>`:"")+(f.transcript?`<span class=label>Model output</span><div class=text>${esc(f.transcript)}</div><div class=export><a class="btn primary" href="/api/benchmark/txt?name=${encodeURIComponent(f.name)}" download>Download .TXT</a><a class=btn href="/api/benchmark/srt?name=${encodeURIComponent(f.name)}" download>Download .SRT</a></div>`:"<div class=empty>Run benchmark after source text is attached.</div>")}
async function refresh(){const st=await fetch("/api/benchmark/state").then(r=>r.json()),sig=JSON.stringify(st)+selected;if(sig!==last){last=sig;render(st)}}refresh();setInterval(refresh,700);
</script></body></html>
